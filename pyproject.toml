[project]
name = "hypothalamic-fc"
version = "0.1.0"
description = "Light-evoked hypothalamic functional connectivity analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "elephant>=1.2.0",
    "matplotlib>=3.10.0",
    "neo>=0.14.0",
    "numpy>=2.0.0,<3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pyinform>=0.2.0",
    "quantities>=0.16.0",
    "scipy>=1.14.0",
]

[tool.uv]
# Pin exact versions via uv.lock (run: uv lock)
# TE note: numpy TE implementation returns 0 for sparse 5ms-binned
# hypothalamic data (mean firing 0.15 Hz). Use pyinform results for TE.
# See: src/py/transfer_entropy_np.py and NEXT_STEPS.md
